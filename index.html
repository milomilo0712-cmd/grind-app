async function shareWorkoutCard() {
  const today = new Date().toISOString().split('T')[0];
  const todayWs = st.workouts.filter(w=>w.date===today);
  if(!todayWs.length) { showToast('今日の記録がありません'); return; }

  const muscles = [...new Set(todayWs.map(w=>w.muscle))].map(id=>MUSCLES.find(m=>m.id===id));
  const totalVol = Math.round(todayWs.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*s.sets,0),0));
  const totalSets = todayWs.reduce((a,w)=>a+w.sets.length,0);
  const maxLifts = {};
  todayWs.forEach(w=>w.sets.forEach(s=>{
    if(!maxLifts[s.exercise]||s.weight>maxLifts[s.exercise]) maxLifts[s.exercise]=s.weight;
  }));

  // Canvas でシェア画像を生成
  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // 背景
  ctx.fillStyle = '#0c0c0f';
  ctx.fillRect(0, 0, 1080, 1920);

  // グリッドパターン
  ctx.strokeStyle = '#1c1c20';
  ctx.lineWidth = 1;
  for(let i=0;i<1080;i+=60){ ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,1920);ctx.stroke(); }
  for(let i=0;i<1920;i+=60){ ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(1080,i);ctx.stroke(); }

  // ロゴ
  ctx.font = 'bold 72px sans-serif';
  ctx.fillStyle = '#f0f0f4';
  ctx.letterSpacing = '8px';
  ctx.fillText('GRIND.', 80, 160);

  // 日付
  const dateStr = new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  ctx.font = '36px sans-serif';
  ctx.fillStyle = '#7a7a88';
  ctx.fillText(dateStr, 80, 220);

  // 部位バー
  let bx = 80;
  muscles.forEach(m => {
    if(!m) return;
    ctx.fillStyle = m.color;
    ctx.beginPath();
    ctx.roundRect(bx, 280, 180, 48, 24);
    ctx.fill();
    ctx.fillStyle = '#0c0c0f';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText(m.label, bx+20, 312);
    bx += 200;
  });

  // 総重量
  ctx.font = 'bold 160px sans-serif';
  ctx.fillStyle = '#f0f0f4';
  ctx.fillText(totalVol.toLocaleString(), 80, 560);
  ctx.font = '40px sans-serif';
  ctx.fillStyle = '#7a7a88';
  ctx.fillText('kg 総ボリューム', 80, 620);

  // セット数
  ctx.font = 'bold 80px sans-serif';
  ctx.fillStyle = '#f0f0f4';
  ctx.fillText(String(totalSets), 80, 760);
  ctx.font = '36px sans-serif';
  ctx.fillStyle = '#7a7a88';
  ctx.fillText('sets', 80, 810);

  // 区切り線
  ctx.strokeStyle = '#2e2e34';
  ctx.lineWidth = 2;
  ctx.beginPath();ctx.moveTo(80,870);ctx.lineTo(1000,870);ctx.stroke();

  // 種目別最大重量
  ctx.font = 'bold 28px sans-serif';
  ctx.fillStyle = '#a0a0b0';
  ctx.fillText("TODAY'S LIFTS", 80, 930);
  let ly = 1000;
  Object.entries(maxLifts).slice(0,6).forEach(([ex,w])=>{
    ctx.font = '36px sans-serif';
    ctx.fillStyle = '#f0f0f4';
    ctx.fillText(ex, 80, ly);
    ctx.font = 'bold 36px sans-serif';
    ctx.fillStyle = '#e8e8ec';
    ctx.fillText(w+'kg', 900, ly);
    ly += 70;
  });

  // フッター
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#505058';
  ctx.fillText('grind-app-seven.vercel.app', 80, 1820);

  // シェアモーダルを表示
  const dataUrl = canvas.toDataURL('image/png');

  const shareModal = document.createElement('div');
  shareModal.className='modal-overlay open';
  shareModal.innerHTML=`<div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:12px;">ワークアウトカード</div>
    <img src="${dataUrl}" style="width:100%;border-radius:10px;margin-bottom:12px;background:#0c0c0f;">
    <div style="font-size:12px;color:var(--muted2);margin-bottom:12px;line-height:1.6;">
      💡 Instagramのストーリーで「写真を選択」→背景写真を選んだあと、このカードをスタンプとして貼り付けできます
    </div>
    <button class="btn btn-acc btn-full" id="save-card-btn" style="margin-bottom:8px;" onclick="
      const a=document.createElement('a');
      a.href='${dataUrl}';
      a.download='grind-workout.png';
      a.click();
      document.getElementById('save-card-btn').textContent='保存しました';
    ">画像を保存</button>
    <button class="btn btn-ghost btn-full" onclick="this.closest('.modal-overlay').remove()">閉じる</button>
  </div>`;
  shareModal.onclick=e=>{if(e.target===shareModal)shareModal.remove();};
  document.body.appendChild(shareModal);
}


// ═══════════════ DM ═══════════════
let dmPartnerId = null;
let dmMessages = {};

function openDM(userId, userName) {
  dmPartnerId = userId;
  document.getElementById('dm-partner-name').textContent = userName;
  if(!dmMessages[userId]) dmMessages[userId]=[];
  // パートナー名を記録
  if(dmMessages[userId].length > 0) dmMessages[userId][0].partnerName = userName;
  else dmMessages[userId].push({from:'system', text:'', ts:'', partnerName: userName});
  renderDMMessages();
  document.getElementById('dm-modal').classList.add('open');
  document.getElementById('dm-modal').onclick = e => { if(e.target===document.getElementById('dm-modal')) closeDM(); };
  showDMBadge(false);
}
function closeDM() {
  document.getElementById('dm-modal').classList.remove('open');
}
function sendDM() {
  const inp = document.getElementById('dm-inp');
  const msg = inp.value.trim();
  if(!msg || !dmPartnerId) return;
  if(!dmMessages[dmPartnerId]) dmMessages[dmPartnerId]=[];
  dmMessages[dmPartnerId].push({from:'me', text:msg, ts:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});
  inp.value='';
  renderDMMessages();
  // TODO: Supabase Realtime で送信
}
function renderDMMessages() {
  const log = document.getElementById('dm-messages');
  const msgs = dmMessages[dmPartnerId]||[];
  log.innerHTML = msgs.length ? msgs.map(m=>`
    <div style="display:flex;${m.from==='me'?'justify-content:flex-end;':''}">
      <div style="background:${m.from==='me'?'var(--s4)':'var(--s2)'};border-radius:${m.from==='me'?'12px 12px 2px 12px':'12px 12px 12px 2px'};padding:8px 12px;max-width:75%;">
        <div style="font-size:13px;color:var(--text);">${m.text}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;text-align:right;">${m.ts}</div>
      </div>
    </div>`).join('')
  : `<div style="text-align:center;color:var(--muted);font-size:12px;padding:20px;">まだメッセージがありません</div>`;
  log.scrollTop = log.scrollHeight;
}

let postPhotoData = null;
function previewPostPhoto(e) {
  const file = e.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    postPhotoData = ev.target.result;
    document.getElementById('post-photo-img').src = ev.target.result;
    document.getElementById('post-photo-preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function removePostPhoto() {
  postPhotoData = null;
  document.getElementById('post-photo-preview').style.display = 'none';
  document.getElementById('post-photo-inp').value = '';
}

function attachTodayWorkout() {
  const today = new Date().toISOString().split('T')[0];
  const todayWs = st.workouts.filter(w=>w.date===today);
  if(!todayWs.length) { showToast('今日のトレーニング記録がありません'); return; }
  if(todayWs.length === 1) {
    st.attachedWorkout = todayWs[0];
    renderAttachPreview();
    showToast('今日の記録を添付しました');
    return;
  }
  // 複数ある場合は選択
  const modal = document.createElement('div');
  modal.className='modal-overlay open';
  modal.innerHTML=`<div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:14px;">今日の記録を選択</div>
    ${todayWs.map((w,i)=>{
      const mc=getMuscleColor(w.muscle);
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--s2);border-radius:9px;margin-bottom:6px;cursor:pointer;" onclick="selectTodayWorkout(${i});document.querySelector('.modal-overlay.open').remove();">
        <div style="width:10px;height:10px;border-radius:50%;background:${mc};"></div>
        <div><div style="font-size:13px;font-weight:600;">${w.muscleLabel}トレ</div>
        <div style="font-size:11px;color:var(--muted2);">${w.exercises.join('・')}</div></div>
      </div>`;
    }).join('')}
    <button class="btn btn-ghost btn-full" style="margin-top:8px;" onclick="this.closest('.modal-overlay').remove()">キャンセル</button>
  </div>`;
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  document.body.appendChild(modal);
}

function selectTodayWorkout(idx) {
  const today = new Date().toISOString().split('T')[0];
  const todayWs = st.workouts.filter(w=>w.date===today);
  st.attachedWorkout = todayWs[idx];
  renderAttachPreview();
  showToast('今日の記録を添付しました');
}

// ═══════════════ OTHER USER PROFILE ═══════════════
let viewingUserId = null;

async function viewUserProfile(userId) {
  viewingUserId = userId;
  try {
    const { data: prof } = await sb.from('profiles')
      .select('id,name,avatar,photo_url,goal,bio,routine,gym,followers,following')
      .eq('id', userId).single();
    if(!prof) return;

    const { data: posts } = await sb.from('posts')
      .select('*,profiles(id,name,avatar,photo_url,goal),likes(user_id),comments(id)')
      .eq('user_id', userId)
      .order('created_at',{ascending:false})
      .limit(20);

    document.getElementById('profile-back-bar').style.display='block';
    const g = GOAL_INFO[prof.goal]||{icon:'💪',label:'—'};
    const isFollowing = st.following?.includes(userId);
    const avatarHtml = prof.photo_url
      ? `<img src="${prof.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : `<span>${prof.avatar||'💪'}</span>`;

    document.getElementById('profile-hero').innerHTML=`
      <div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:12px;">
        <div class="profile-avatar-lg" style="border-color:#9898a8;background:var(--s2);">${avatarHtml}</div>
        <div>
          <div class="profile-name">${prof.name}</div>
          ${prof.gym?`<div style="font-size:12px;color:var(--muted2);margin-top:2px;">🏋️ ${prof.gym}</div>`:''}
          <div class="profile-goal-badge">${g.icon} ${g.label}</div>
        </div>
      </div>
      ${prof.bio?`<div style="font-size:13px;color:var(--muted2);margin-bottom:8px;line-height:1.6;">${prof.bio}</div>`:''}
      ${prof.routine?`<div style="background:var(--s2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted2);margin-bottom:8px;"><span style="color:var(--text);font-weight:600;margin-right:6px;">ルーティン</span>${prof.routine}</div>`:''}
      <div class="profile-stats">
        <div class="ps-item"><div class="ps-val">${prof.followers||0}</div><div class="ps-label">フォロワー</div></div>
        <div class="ps-item"><div class="ps-val">${prof.following||0}</div><div class="ps-label">フォロー</div></div>
      </div>`;

    document.getElementById('profile-actions').innerHTML=`
      <button class="btn ${isFollowing?'btn-ghost':'btn-acc'} btn-sm" onclick="toggleFollowUser('${userId}',this)">${isFollowing?'フォロー中':'フォローする'}</button>
      <button class="btn btn-ghost btn-sm" onclick="openDM('${userId}','${prof.name.replace(/'/g,'\'')}')">DM</button>`;

    const myPostsList = document.getElementById('my-posts-list');
    if(posts?.length) {
      const myId = st.profile?.id;
      const remotePosts = posts.map(p=>({
        id:p.id, userId:p.user_id, _profile:p.profiles,
        text:p.body, workout:null, photo:p.photo_url||null,
        likes:p.likes?.length||0, liked:p.likes?.some(l=>l.user_id===myId)||false,
        comments:[], ts:timeAgo(p.created_at)
      }));
      myPostsList.innerHTML = remotePosts.map(p=>renderPost(p)).join('');
    } else {
      myPostsList.innerHTML='<div class="empty-state"><div class="empty-icon">📝</div><div>まだ投稿がありません</div></div>';
    }
    switchView('profile');
  } catch(e) { showToast('プロフィールを読み込めませんでした'); }
}

async function toggleFollowUser(userId, btn) {
  await toggleFollow(userId, btn);
  // フォロワー数をSupabaseに更新
  try {
    const isNowFollowing = st.following?.includes(userId);
    await sb.from('profiles').update({
      following: (st.profile.following||0) + (isNowFollowing?1:-1)
    }).eq('id', st.profile.id);
  } catch(e){}
}

function showMyProfile() {
  viewingUserId = null;
  document.getElementById('profile-back-bar').style.display='none';
  renderProfile();
}

  const goal = document.getElementById('up-goal-inp')?.value?.trim();
  const duration = document.getElementById('up-duration')?.value;
  const freq = document.getElementById('up-freq')?.value;
  if(!goal || goal.length < 3) {
    // 入力欄を赤くしてエラー表示
    const inp = document.getElementById('up-goal-inp');
    if(inp) {
      inp.style.borderColor = '#e05555';
      inp.placeholder = '⚠️ 目標を入力してください（例：3ヶ月でベンチ100kg）';
      setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = '例：3ヶ月でベンチ100kg達成したい'; }, 3000);
    }
    showToast('目標を入力してください');
    return;
  }
  if(!duration) { showToast('期間を選択してください'); return; }
  if(!freq) { showToast('週の頻度を選択してください'); return; }

  const result = document.getElementById('unified-plan-result');
  const btn = document.querySelector('#unified-plan-modal .btn-acc');
  if(btn) { btn.disabled=true; btn.textContent='生成中（20〜30秒）...'; }
  result.innerHTML = `<div style="text-align:center;padding:24px 0;">
    <div class="ai-typing" style="justify-content:center;display:flex;gap:6px;margin-bottom:12px;"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>
    <div style="font-size:12px;color:var(--muted2);">トレーニング・食事・月別プランを生成中...</div>
  </div>`;

    const text = await callClaude(
      `あなたはプロのパーソナルトレーナー兼栄養士です。

          "desc": "プラン説明",

              }
            }
          }

        ],

// ═══════════════ HOME ═══════════════
function renderHome() {
  // 挨拶と日付
  const now = new Date();
  const h = now.getHours();
  const greeting = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
  const dateStr = now.toLocaleDateString('ja-JP', {month:'long', day:'numeric', weekday:'short'});
  const el = document.getElementById('home-greeting');
  const del = document.getElementById('home-date');
  if(el) el.textContent = greeting + (st.profile?.name ? ', ' + st.profile.name.split(' ')[0] : '');
  if(del) del.textContent = dateStr;

  // 人体SVG
  renderBodySVG();

  // 今日の部位情報
  const today = new Date().toISOString().split('T')[0];
  const todayWs = st.workouts.filter(w=>w.date===today);
  const musclesEl = document.getElementById('home-today-muscles');
  if(musclesEl) {
    if(!todayWs.length) {
      musclesEl.innerHTML = `<div style="color:var(--muted2);font-size:13px;line-height:1.6;">
        まだ今日の記録がありません。<br>
        <button onclick="switchView('record')" class="btn btn-acc btn-sm" style="margin-top:8px;">記録を始める</button>
      </div>`;
    } else {
      const muscles = [...new Set(todayWs.map(w=>w.muscle))];
      const totalVol = Math.round(todayWs.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*(s.sets||1),0),0));
      const totalSets = todayWs.reduce((a,w)=>a+w.sets.length,0);
      musclesEl.innerHTML = `
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
          ${muscles.map(mid=>{
            const col = getMuscleColor(mid);
            const lbl = getMuscleLabel(mid);
            return `<span style="background:${col}20;border:1px solid ${col}50;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:${col};">${lbl}</span>`;
          }).join('')}
        </div>
        <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--text);">${totalVol.toLocaleString()}<span style="font-size:12px;font-weight:400;color:var(--muted2);margin-left:4px;">kg</span></div>
        <div style="font-size:11px;color:var(--muted2);">${totalSets} sets 完了</div>
        ${todayWs.flatMap(w=>w.sets).length > 0 ? `
        <div style="margin-top:10px;">
          ${todayWs.flatMap(w=>w.sets.map(s=>({...s, muscle:w.muscle}))).map(s=>`
            <div onclick="showExerciseDetail(this.dataset.ex)" data-ex="${s.exercise}" style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff06;cursor:pointer;active-opacity:.7;">
              <div style="font-size:12px;color:var(--text);">${s.exercise}</div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:12px;color:var(--muted2);">${s.weight}kg × ${s.reps}rep</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>`).join('')}
        </div>` : ''}`;
    }
  }

  // 今日のプラン提案
  renderHomePlanCard();

  // 最近の記録（3件）
  const recentEl = document.getElementById('home-recent-list');
  if(recentEl) {
    const allWs = st.workouts;
    if(!allWs.length) {
      recentEl.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">まだ記録がありません</div>';
    } else {
      // 日付グループで最新3日分
      const byDate={};
      allWs.forEach(w=>{ if(!byDate[w.date]) byDate[w.date]=[]; byDate[w.date].push(w); });
      const sortedDates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,4);
      recentEl.innerHTML = sortedDates.map(dateStr=>{
        const ws=byDate[dateStr];
        const muscles=[...new Set(ws.map(w=>w.muscle))];
        const vol=Math.round(ws.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*(s.sets||1),0),0));
        const sets=ws.reduce((a,w)=>a+w.sets.length,0);
        const d=new Date(dateStr);
        const isToday=dateStr===today;
        const col=getMuscleColor(muscles[0]);
        return `<div onclick="showWorkoutDetailModal('${dateStr}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s1);border-radius:10px;margin-bottom:6px;border-left:3px solid ${col};cursor:pointer;">
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
              <span style="font-size:13px;font-weight:600;">${isToday?'今日':d.getMonth()+1+'/'+d.getDate()}</span>
              <div style="display:flex;gap:3px;">${muscles.map(m=>`<span style="width:8px;height:8px;border-radius:50%;background:${getMuscleColor(m)};display:inline-block;"></span>`).join('')}</div>
            </div>
            <div style="font-size:11px;color:var(--muted2);">${ws.flatMap(w=>w.exercises).slice(0,3).join(' · ')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:14px;font-weight:700;color:${col};">${vol.toLocaleString()}</div>
            <div style="font-size:10px;color:var(--muted);">${sets} sets</div>
          </div>
        </div>`;
      }).join('');
    }
  }

  // フィードプレビュー（3件）
  const feedEl = document.getElementById('home-feed-preview');
  if(feedEl) {
    const posts = st.posts.filter(p=>!String(p.id).startsWith('p')).slice(0,3);
    if(!posts.length) {
      feedEl.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">まだ投稿がありません</div>';
    } else {
      feedEl.innerHTML = posts.map(p=>renderPost(p)).join('');
    }
  }
}

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>

// ─── SNSタブ切り替え ───
let snsTab = 'all';
function switchSnsTab(tab) {
  snsTab = tab;
  ['all','following','ranking'].forEach(t => {
    const btn = document.getElementById('sns-tab-'+t);
    if(btn) btn.classList.toggle('on', t===tab);
  });
  renderSnsContent();
}

function renderSnsContent() {
  const el = document.getElementById('sns-content');
  if(!el) return;
  if(snsTab === 'ranking') {
    renderWeeklyRanking();
    return;
  }
  let posts = [...st.posts];
  if(snsTab === 'following' && st.following?.length) {
    posts = posts.filter(p => p.userId==='me' || st.following.includes(p.userId));
  }
  el.innerHTML = posts.map(p=>renderPost(p)).join('');
  // コンポーザーアバターも更新
  renderComposerAvatar();
}

          <div style="font-size:13px;font-weight:600;">${name}</div>
          <div style="font-size:11px;color:var(--muted2);">あなた</div>

// 目標と頻度からサンプルプランを取得
function getSamplePlan(goal, freq) {
  const freqKey = freq <= 2 ? 2 : freq <= 3 ? 3 : freq <= 4 ? 4 : 5;
  const goalKey = goal === 'muscle_gain' ? 'muscle_gain'
    : goal === 'fat_loss' ? 'fat_loss'
    : goal === 'beginner' ? 'beginner'
    : 'maintenance';
  return SAMPLE_PLANS[goalKey + '_' + freqKey] || SAMPLE_PLANS['beginner_3'];
}

// 現在のユーザーのアクティブプランを取得
function getActivePlan() {
  const profile = st.profile;
  if(!profile) return null;
  // 有料プランの専用プランが保存されていればそれを使う
  if(profile.customPlan) return profile.customPlan;
  // それ以外はサンプルプランを返す
  const freq = profile.weekly_freq || 3;
  return getSamplePlan(profile.goal || 'beginner', freq);
}

let _selectorGoal = null;
let _selectorFreq = null;

function selectorSelectGoal(el, goal) {
  _selectorGoal = goal;
  document.querySelectorAll('#sample-plan-modal [data-goal]').forEach(b => {
    const isOn = b.dataset.goal === goal;
    b.style.background = isOn ? '#c97b7b20' : 'var(--s2)';
    b.style.borderColor = isOn ? '#c97b7b' : 'var(--s3)';
    b.style.color = isOn ? '#c97b7b' : 'var(--muted2)';
  });
  updatePlanSelectorPreview(goal, _selectorFreq || st.profile?.weekly_freq || 3);
}

function selectorSelectFreq(el, freq) {
  _selectorFreq = freq;
  document.querySelectorAll('#sample-plan-modal [data-freq]').forEach(b => {
    const isOn = parseInt(b.dataset.freq) === freq;
    b.style.background = isOn ? '#c97b7b20' : 'var(--s2)';
    b.style.borderColor = isOn ? '#c97b7b' : 'var(--s3)';
    b.style.color = isOn ? '#c97b7b' : 'var(--muted2)';
  });
  updatePlanSelectorPreview(_selectorGoal || st.profile?.goal || 'muscle_gain', freq);
}

function updatePlanSelectorPreview(goal, freq) {
  const plan = getSamplePlan(goal, freq);
  if(!plan) return;
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('plan-selector-name').textContent = plan.name;
  document.getElementById('plan-selector-desc').textContent = plan.desc;
  document.getElementById('plan-selector-schedule').innerHTML =
    Object.entries(plan.schedule).filter(([,v])=>v).map(([dayIdx, session])=>{
      const col = getMuscleColor(session.muscle);
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff05;">
        <span style="font-size:11px;color:var(--muted2);width:20px;">${days[parseInt(dayIdx)]}</span>
        <span style="font-size:11px;font-weight:600;color:${col};">${session.label}</span>
        <span style="font-size:10px;color:var(--muted);flex:1;">${session.exercises.slice(0,3).join('・')}${session.exercises.length>3?'...':''}</span>
      </div>`;
    }).join('');
}

function applySamplePlan() {
  const goal = _selectorGoal || st.profile?.goal || 'muscle_gain';
  const freq = _selectorFreq || st.profile?.weekly_freq || 3;
  const plan = getSamplePlan(goal, freq);
  if(!plan) return;

  // プロフィール更新
  st.profile.goal = goal;
  st.profile.weekly_freq = freq;
  st.profile.customPlan = null;    // 専用プランをリセット
  st.profile.planDayMap = {};      // 曜日マップもリセット
  save();

  _selectorGoal = null;
  _selectorFreq = null;

  document.getElementById('sample-plan-modal').remove();
  renderPlanView();
  showToast(plan.name + ' に変更しました ✓');
}

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div>
              <select id="edit-day-${dayIdx}" style="background:var(--s2);border:1px solid var(--s3);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--text);font-family:'DM Sans',sans-serif;">
                ${days.map((d,i)=>`<option value="${i}" ${parseInt(dayIdx)===i?'selected':''}>${d}曜日</option>`).join('')}
              </select>
            </div>
            <input id="edit-label-${dayIdx}" style="background:var(--s2);border:1px solid var(--s3);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;color:${col};font-family:'DM Sans',sans-serif;flex:1;margin:0 8px;" value="${session.label}">
          </div>

          <!-- 種目リスト -->
          <div id="edit-exercises-${dayIdx}">
            ${session.exercises.map((e,ei)=>{
              const s = session.sets?.[e] || {weight:0,reps:10,sets:3,note:''};
              return `<div style="background:var(--s2);border-radius:8px;padding:10px;margin-bottom:6px;" id="edit-ex-${dayIdx}-${ei}">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
                  <input id="edit-exname-${dayIdx}-${ei}" style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--s3);padding:2px 0;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;" value="${e}">
                  <button onclick="removeExercise('${dayIdx}',${ei})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px;">✕</button>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
                  <div>
                    <div style="font-size:9px;color:var(--muted2);margin-bottom:2px;">重量(kg)</div>
                    <input id="edit-weight-${dayIdx}-${ei}" type="number" class="inp" style="padding:5px 8px;font-size:13px;" value="${s.weight}" min="0" max="500">

                    <input id="edit-reps-${dayIdx}-${ei}" type="number" class="inp" style="padding:5px 8px;font-size:13px;" value="${s.reps}" min="1" max="100">

                    <input id="edit-sets-${dayIdx}-${ei}" type="number" class="inp" style="padding:5px 8px;font-size:13px;" value="${s.sets}" min="1" max="20">
                  </div>
                </div>
                <input id="edit-note-${dayIdx}-${ei}" class="inp" style="margin-top:6px;padding:5px 8px;font-size:11px;" placeholder="メモ（例：インターバル90秒）" value="${s.note||''}">
              </div>`;
            }).join('')}
          </div>
          <button onclick="addExercise('${dayIdx}')" style="width:100%;background:var(--s2);border:1px dashed var(--s3);border-radius:8px;padding:8px;font-size:11px;color:var(--muted2);cursor:pointer;font-family:'DM Sans',sans-serif;">+ 種目を追加</button>
        </div>`;

      </div>

  }

  modal.innerHTML = `<div class="modal-sheet" style="max-height:90vh;overflow-y:auto;">
    <div class="modal-handle"></div>
    <div id="plan-edit-content">${renderEditContent()}</div>
  </div>`;
  modal.onclick = e => { if(e.target===modal) modal.remove(); };
  document.body.appendChild(modal);

  // editPlanをグローバルに保持
  window._editPlan = editPlan;

  // 種目追加・削除関数
  window.addExercise = function(dayIdx) {
    if(!window._editPlan.schedule[dayIdx]) return;
    window._editPlan.schedule[dayIdx].exercises.push('新しい種目');
    if(!window._editPlan.schedule[dayIdx].sets) window._editPlan.schedule[dayIdx].sets = {};
    window._editPlan.schedule[dayIdx].sets['新しい種目'] = {weight:0, reps:10, sets:3, note:''};
    document.getElementById('plan-edit-content').innerHTML = renderEditContent();
  };

  window.removeExercise = function(dayIdx, exIdx) {
    const s = window._editPlan.schedule[dayIdx];
    if(!s) return;
    const exName = s.exercises[exIdx];
    s.exercises.splice(exIdx, 1);
    if(s.sets) delete s.sets[exName];
    document.getElementById('plan-edit-content').innerHTML = renderEditContent();
  };
}

function savePlanEdit() {
  const plan = window._editPlan;
  if(!plan) return;

  // プラン名を更新
  const nameEl = document.getElementById('edit-plan-name');
  if(nameEl) plan.name = nameEl.value.trim() || plan.name;

  // 各セッションのデータを収集
  const sessions = Object.entries(plan.schedule).filter(([,v])=>v);
  const newSchedule = {};

  sessions.forEach(([origDayIdx, session]) => {
    // 曜日変更
    const dayEl = document.getElementById('edit-day-'+origDayIdx);
    const newDayIdx = dayEl ? dayEl.value : origDayIdx;

    // ラベル変更
    const labelEl = document.getElementById('edit-label-'+origDayIdx);
    if(labelEl) session.label = labelEl.value.trim() || session.label;

    // 種目・重量を収集
    const newSets = {};
    const newExercises = [];
    session.exercises.forEach((e, ei) => {
      const nameEl = document.getElementById('edit-exname-'+origDayIdx+'-'+ei);
      const weightEl = document.getElementById('edit-weight-'+origDayIdx+'-'+ei);
      const repsEl = document.getElementById('edit-reps-'+origDayIdx+'-'+ei);
      const setsEl = document.getElementById('edit-sets-'+origDayIdx+'-'+ei);
      const noteEl = document.getElementById('edit-note-'+origDayIdx+'-'+ei);

      const exName = nameEl ? nameEl.value.trim() : e;
      if(!exName) return;

      newExercises.push(exName);
      newSets[exName] = {
        weight: parseFloat(weightEl?.value) || 0,
        reps: parseInt(repsEl?.value) || 10,
        sets: parseInt(setsEl?.value) || 3,
        note: noteEl?.value || '',
      };
    });

    session.exercises = newExercises;
    session.sets = newSets;
    newSchedule[newDayIdx] = session;
  });

  plan.schedule = newSchedule;

  // 保存（カスタムプランとして保存）
  st.profile.customPlan = plan;
  st.profile.planDayMap = {};
  save();

  document.getElementById('plan-edit-modal').remove();
  renderPlanView();
  showToast('プランを保存しました ✓');
}

// ═══════════════ 1RM計算 (Epley式) ═══════════════
function calc1RM(weight, reps) {
  if(reps === 1) return weight;
  return Math.round(weight * (1 + reps / 30));
}

// 種目詳細モーダル（推移グラフ・1RM）

// ═══════════════ STRAVA STYLE SHARE ═══════════════
async function shareWorkoutCard() {
  const today = new Date().toISOString().split('T')[0];
  const todayWs = st.workouts.filter(w=>w.date===today);
  if(!todayWs.length) { showToast('今日の記録がありません'); return; }
  // 直接スタンプ生成
  await generateShareCard(null);
}

async function generateShareCard(event) {
  const today = new Date().toISOString().split('T')[0];
  const todayWs = st.workouts.filter(w=>w.date===today);
  const muscles = [...new Set(todayWs.map(w=>w.muscle))];
  const totalVol = Math.round(todayWs.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*(s.sets||1),0),0));
  const totalSets = todayWs.reduce((a,w)=>a+w.sets.length,0);
  const maxLifts = {};
  todayWs.forEach(w=>w.sets.forEach(s=>{ if(!maxLifts[s.exercise]||s.weight>maxLifts[s.exercise]) maxLifts[s.exercise]=s.weight; }));

  // スタンプサイズ（正方形）
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 800;
  const ctx = canvas.getContext('2d');

  // ── 透明背景（何も塗らない）──
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // カード（角丸・ダークで輪郭くっきり）
  const pad = 32;
  ctx.fillStyle = 'rgba(12, 12, 15, 0.94)';
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(pad, pad, canvas.width-pad*2, canvas.height-pad*2, 36);
  ctx.fill();
  ctx.stroke();

  // アクセントライン（上部）
  const firstMuscleColor = muscles.length ? getMuscleColor(muscles[0]) : '#c97b7b';
  const accentGrad = ctx.createLinearGradient(pad, 0, canvas.width-pad, 0);
  accentGrad.addColorStop(0, firstMuscleColor);
  accentGrad.addColorStop(1, getMuscleColor(muscles[1] || muscles[0]) || firstMuscleColor);
  ctx.fillStyle = accentGrad;
  ctx.beginPath();
  ctx.roundRect(pad, pad, canvas.width-pad*2, 6, [36, 36, 0, 0]);
  ctx.fill();

  // GRINDロゴ
  ctx.font = 'bold 56px sans-serif';
  ctx.fillStyle = '#f0f0f4';
  ctx.letterSpacing = '6px';
  ctx.fillText('GRIND.', pad+36, pad+82);

  // 日付
  const dateStr = new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
  ctx.font = '26px sans-serif';
  ctx.fillStyle = '#7a7a88';
  ctx.letterSpacing = '0px';
  ctx.fillText(dateStr, pad+36, pad+118);

  // 部位バッジ
  let bx = pad + 36;
  muscles.forEach(mid => {
    const col = getMuscleColor(mid);
    const lbl = getMuscleLabel(mid);
    ctx.fillStyle = col + '28';
    ctx.strokeStyle = col + '70';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(bx, pad+135, 140, 38, 19);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(lbl, bx+16, pad+159);
    bx += 158;
  });

  // 総ボリューム
  ctx.font = 'bold 110px sans-serif';
  ctx.fillStyle = '#f0f0f4';
  ctx.fillText(totalVol.toLocaleString(), pad+36, pad+310);
  ctx.font = '28px sans-serif';
  ctx.fillStyle = '#7a7a88';
  ctx.fillText('kg  total volume', pad+36, pad+350);

  // セット数
  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#f0f0f4';
  ctx.fillText(totalSets + ' sets', pad+36, pad+415);

  // 区切り線
  ctx.strokeStyle = '#2a2a30';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad+36, pad+440); ctx.lineTo(canvas.width-pad-36, pad+440); ctx.stroke();

  // 種目別
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#606068';
  ctx.letterSpacing = '1px';
  ctx.fillText('TODAYS LIFTS', pad+36, pad+476);
  ctx.letterSpacing = '0px';
  let ly = pad + 520;
  Object.entries(maxLifts).slice(0,4).forEach(([ex,w])=>{
    ctx.font = '26px sans-serif';
    ctx.fillStyle = '#d0d0d8';
    ctx.fillText(ex, pad+36, ly);
    ctx.font = 'bold 26px sans-serif';
    ctx.fillStyle = '#f0f0f4';
    ctx.textAlign = 'right';
    ctx.fillText(w+'kg', canvas.width-pad-36, ly);
    ctx.textAlign = 'left';
    ly += 56;
  });

  // フッター
  ctx.font = '20px sans-serif';
  ctx.fillStyle = '#303038';
  ctx.fillText('grind-app-seven.vercel.app', pad+36, canvas.height-pad-28);

  // PNG（透明背景）で出力
  const dataUrl = canvas.toDataURL('image/png');

  // Blobに変換
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const file = new File([blob], 'grind-card.png', {type:'image/png'});

  // navigator.shareで直接シェア（Stravaと同じUI）
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
    try {
      await navigator.share({
        files: [file],
        title: 'GRIND Workout',
      });
      return;
    } catch(e) {
      if(e.name === 'AbortError') return; // ユーザーがキャンセル
    }
  }

  // フォールバック：プレビューモーダル（PCなど）
  const shareModal = document.createElement('div');
  shareModal.className='modal-overlay open';
  shareModal.innerHTML=`<div class="modal-sheet">
    <div class="modal-handle"></div>
    <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:12px;">ワークアウトカード</div>
    <div style="border-radius:12px;overflow:hidden;margin-bottom:14px;
      background-image:linear-gradient(45deg,#1a1a1e 25%,#242428 25%,#242428 50%,#1a1a1e 50%,#1a1a1e 75%,#242428 75%);
      background-size:16px 16px;">
      <img src="${dataUrl}" style="width:100%;display:block;">
    </div>
    <button class="btn btn-acc btn-full" id="save-card-btn" style="margin-bottom:8px;" onclick="
      const a=document.createElement('a');
      a.href='${dataUrl}';
      a.download='grind-card.png';
      a.click();
      document.getElementById('save-card-btn').textContent='保存しました ✓';
    ">保存</button>
    <button class="btn btn-ghost btn-full" onclick="this.closest('.modal-overlay').remove()">閉じる</button>
  </div>`;
  shareModal.onclick=e=>{if(e.target===shareModal)shareModal.remove();};
  document.body.appendChild(shareModal);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// ═══════════════ BOOT ═══════════════
function showAuthScreen() {
  document.getElementById('auth-screen').style.display='block';
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('app').style.display='none';
}

function showAppScreen() {
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('app').style.display='flex';
}

(async function boot(){
  // Supabase SDKの読み込みを待つ
  let tries = 0;
  while (typeof supabase === 'undefined' && tries < 50) {
    await new Promise(r => setTimeout(r, 100));
    tries++;
  }
  if(typeof supabase === 'undefined') {
    console.error('Supabase failed to load');
    showAuthScreen();
    return;
  }

  try {
    // まずlocalStorageのセッションを確認
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      await loadUserData(session.user.id);
      showAppScreen();
      initApp();
      return;
    }

    // セッションがない場合は自動サインインを試みる
    const savedEmail = localStorage.getItem('grind_session_email');
    const savedPw = localStorage.getItem('grind_session_pw');
    if(savedEmail && savedPw) {
      const { data, error } = await sb.auth.signInWithPassword({
        email: savedEmail, password: savedPw
      });
      if(!error && data.session) {
        await loadUserData(data.session.user.id);
        showAppScreen();
        initApp();
        return;
      }
    }
    showAuthScreen();
  } catch(e) {
    console.error('boot error:', e);
    showAuthScreen();
  }
})();
</script>
