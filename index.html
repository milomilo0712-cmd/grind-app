<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GRIND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0c0c0f;--s1:#131316;--s2:#1c1c20;--s3:#242428;--s4:#2e2e34;
  --acc:#e8e8ec;--acc2:#9898a8;--acc3:#606068;
  --text:#f0f0f4;--muted:#505058;--muted2:#787880;
  --danger:#e05555;--warn:#c8843a;--info:#5588bb;
  --r:12px;--r2:20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
#app{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;}

/* ── NAV ── */
.nav{display:flex;background:var(--s1);border-top:1px solid #ffffff08;position:relative;z-index:50;flex-shrink:0;}
.nav-btn{flex:1;padding:10px 2px 8px;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;}
.nav-btn svg{width:22px;height:22px;}
.nav-btn.active{color:var(--text);}
.nav-btn.active svg{filter:drop-shadow(0 0 6px #e8e8ec70);}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--danger);position:absolute;top:8px;right:8px;}

/* ── VIEWS ── */
.views{flex:1;overflow:hidden;position:relative;}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:0 0 16px;}
.view.active{display:block;}
.view-pad{padding:16px;}

/* ── TYPOGRAPHY ── */
.bebas{font-family:'Syne',sans-serif;letter-spacing:1px;}
.section-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:0px;color:var(--text);margin-bottom:14px;text-transform:uppercase;}
.label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;}

/* ── CARDS ── */
.card{background:var(--s1);border:1px solid #ffffff07;border-radius:var(--r);padding:16px;margin-bottom:10px;}
.card-sm{padding:12px;}
.card-xs{padding:8px 12px;}

/* ── HEADER BAR ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex-shrink:0;background:var(--bg);}
.app-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);letter-spacing:3px;text-transform:uppercase;}
.top-bar-actions{display:flex;gap:8px;}
.icon-btn{background:var(--s2);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--s3);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}

/* ── INPUTS ── */
.inp{background:var(--s2);border:1.5px solid #ffffff0c;border-radius:8px;padding:10px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;width:100%;transition:border-color .2s;outline:none;}
.inp:focus{border-color:var(--acc2);}
.inp-group{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}

/* ── BUTTONS ── */
.btn{border:none;border-radius:9px;padding:11px 18px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn-acc{background:var(--text);color:#0c0c0f;}
.btn-acc:hover{background:#ffffff;transform:translateY(-1px);}
.btn-ghost{background:none;border:1.5px solid #ffffff12;color:var(--muted2);}
.btn-ghost:hover{border-color:var(--muted2);color:var(--text);}
.btn-danger{background:none;border:1.5px solid var(--danger);color:var(--danger);padding:5px 10px;font-size:11px;}
.btn-full{width:100%;}
.btn-sm{padding:7px 13px;font-size:12px;}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:6px;}

/* ── TAGS / CHIPS ── */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border:1px solid #ffffff0e;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all .18s;color:var(--muted2);}
.chip:hover{border-color:var(--muted2);color:var(--text);}
.chip.on{background:var(--acc);color:#0c0c0f;border-color:var(--acc);font-weight:600;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}

/* ── MUSCLE GRID ── */
.muscle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.m-btn{background:var(--s2);border:1.5px solid #ffffff08;border-radius:11px;padding:12px 6px 10px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;}
.m-btn .db-icon{width:36px;height:36px;flex-shrink:0;}
.m-btn .db-bar{height:3px;width:80%;border-radius:2px;margin-top:2px;opacity:.5;transition:opacity .2s;}
.m-btn:hover{border-color:var(--muted2);color:var(--text);}
.m-btn:hover .db-bar{opacity:1;}
.m-btn.on{border-color:var(--text);color:var(--text);}
.m-btn.on .db-bar{opacity:1;}

/* ── SET TABLE ── */
.set-row{display:grid;grid-template-columns:26px 1fr 60px 70px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff05;font-size:13px;}
.set-row:last-child{border-bottom:none;}
.set-num{width:22px;height:22px;border-radius:50%;background:var(--s3);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
.sv{color:var(--text);font-weight:500;text-align:center;}
.sh{color:var(--muted);font-size:10px;text-transform:uppercase;text-align:center;}

/* ── LIVE SET RECORDER ── */
.live-recorder{background:var(--s1);border:1.5px solid #ffffff0a;border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.live-ex-tab{display:flex;overflow-x:auto;border-bottom:1px solid #ffffff08;padding:0 12px;gap:0;}
.live-ex-tab::-webkit-scrollbar{display:none;}
.ex-tab-btn{flex-shrink:0;padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;}
.ex-tab-btn.active{color:var(--text);border-bottom-color:var(--text);}
.live-set-area{padding:14px;}
.set-history{margin-bottom:12px;min-height:32px;}
.set-done-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--s2);border-radius:8px;margin-bottom:6px;font-size:13px;}
.set-done-num{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--acc);width:24px;}
.set-done-val{flex:1;color:var(--text);}
.set-done-vol{font-size:11px;color:var(--muted);}
.set-input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.inp-big{background:var(--s2);border:1.5px solid #ffffff10;border-radius:10px;padding:14px 12px 8px;color:var(--text);font-size:22px;font-weight:600;width:100%;outline:none;transition:border-color .2s;text-align:center;font-family:'DM Sans',sans-serif;}
.inp-big:focus{border-color:var(--acc2);}
.inp-big-label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:4px;}
.prev-hint{font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px;}
.prev-hint span{color:var(--acc);}
.add-set-btn{width:100%;padding:13px;background:var(--acc);color:#0c0c0f;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-set-btn:hover{background:#ffffff;transform:translateY(-1px);}
.add-set-btn:active{transform:translateY(0);}
.rest-timer{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--s2);border:1px solid var(--s4);border-radius:8px;margin-top:10px;font-size:12px;color:var(--muted2);}
.rest-timer-val{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px;}
.cdn{text-align:center;font-size:10px;color:var(--muted);padding:4px 0;text-transform:uppercase;}
.cd{min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:7px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .14s;position:relative;gap:2px;padding:4px 2px;}
.cd:hover{background:var(--s2);color:var(--text);}
.cd.today .cd-num{color:var(--text);font-weight:700;}
.cd.today::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--acc);}
.cd.hw{background:#0d0d14;}
.cd.hw:hover{background:var(--s2);}
.cd.om{opacity:.2;}
.cd.sel .cd-num{background:var(--acc);color:#0c0c0f;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;}
.cd-num{line-height:1;font-size:12px;}
.cd-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;max-width:90%;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.month-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-c{background:var(--s2);border-radius:11px;padding:13px;text-align:center;}
.stat-v{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--text);}
.stat-l{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;}

/* ── STREAK ── */
.streak-bar{display:flex;gap:3px;margin:8px 0;}
.sd{flex:1;height:5px;border-radius:3px;background:var(--s3);}
.sd.done{background:var(--acc3);}

/* ── CHART ── */
.chart-wrap{position:relative;height:170px;margin:6px 0;}

/* ── FILTER ROW ── */
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.filter-row::-webkit-scrollbar{display:none;}
.fbtn{flex-shrink:0;background:var(--s2);border:1.5px solid #ffffff08;border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.fbtn.on{background:var(--s3);border-color:var(--acc2);color:var(--text);}

/* ── SNS FEED ── */
.post-card{background:var(--s1);border:1px solid #ffffff07;border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.post-header{display:flex;align-items:center;gap:10px;padding:13px 14px 10px;}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;border:2px solid transparent;}
.avatar-sm{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.post-meta{flex:1;}
.post-name{font-weight:600;font-size:14px;}
.post-time{font-size:11px;color:var(--muted);}
.post-muscle-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.post-body{padding:0 14px 12px;}
.post-text{font-size:14px;line-height:1.6;margin-bottom:10px;}
.post-workout-box{background:var(--s2);border-radius:9px;padding:11px;margin-bottom:10px;}
.post-ex-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px solid #ffffff05;}
.post-ex-row:last-child{border-bottom:none;}
.post-actions{display:flex;gap:0;border-top:1px solid #ffffff07;}
.post-action{flex:1;background:none;border:none;color:var(--muted);padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-family:'DM Sans',sans-serif;transition:color .15s;}
.post-action:hover{color:var(--text);}
.post-action.liked{color:#e05555;}
.post-action svg{width:16px;height:16px;}

/* ── COMMENTS ── */
.comments-wrap{padding:0 14px 12px;border-top:1px solid #ffffff06;}
.comment-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff04;}
.comment-item:last-child{border-bottom:none;}
.comment-body{flex:1;}
.comment-name{font-size:12px;font-weight:600;margin-bottom:2px;}
.comment-text{font-size:12px;color:var(--muted2);line-height:1.5;}
.comment-input-row{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid #ffffff06;}
.comment-inp{flex:1;background:var(--s2);border:1px solid #ffffff0a;border-radius:20px;padding:7px 13px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
.comment-inp:focus{border-color:var(--acc2);}

/* ── PROFILE ── */
.profile-hero{background:linear-gradient(160deg,var(--s2),var(--bg));padding:24px 16px 16px;border-bottom:1px solid #ffffff07;}
.profile-avatar-lg{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;border:3px solid var(--acc);margin-bottom:12px;position:relative;cursor:pointer;overflow:hidden;flex-shrink:0;}
.profile-avatar-lg img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-edit-overlay{position:absolute;inset:0;background:#00000070;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:18px;}
.profile-avatar-lg:hover .avatar-edit-overlay{opacity:1;}
.profile-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;}
.profile-goal-badge{display:inline-flex;align-items:center;gap:5px;background:var(--s3);border:1px solid var(--s4);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted2);margin-top:6px;}
.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;}
.ps-item{text-align:center;}
.ps-val{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text);}
.ps-label{font-size:10px;color:var(--muted);text-transform:uppercase;}

/* ── AI COACH ── */
.ai-hero{background:var(--s2);border:1px solid var(--s4);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;}
.ai-hero::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:radial-gradient(circle,#60606820,transparent);border-radius:50%;}
.ai-badge{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--s4);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--muted2);margin-bottom:10px;}
.ai-msg{font-size:14px;line-height:1.7;color:var(--text);}
.ai-typing{display:flex;gap:5px;padding:6px 0;}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--acc3);animation:aib .9s ease-in-out infinite;}
.ai-dot:nth-child(2){animation-delay:.2s;}
.ai-dot:nth-child(3){animation-delay:.4s;}
@keyframes aib{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-7px);}}

.task-item{display:flex;align-items:flex-start;gap:12px;padding:12px;background:var(--s2);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:all .15s;border:1px solid #ffffff06;}
.task-item:hover{border-color:#e8e8ec30;}
.task-item.done{opacity:.5;}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;}
.task-check.done{background:var(--acc);border-color:var(--acc);color:#0c0c0f;}
.task-content{flex:1;}
.task-title{font-size:13px;font-weight:500;margin-bottom:3px;}
.task-desc{font-size:11px;color:var(--muted2);line-height:1.5;}
.task-category{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-bottom:6px;display:inline-block;}

/* ── GOAL SELECTOR ── */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.goal-btn{background:var(--s2);border:1.5px solid #ffffff08;border-radius:11px;padding:14px;cursor:pointer;transition:all .2s;text-align:left;font-family:'DM Sans',sans-serif;}
.goal-btn .gi{font-size:22px;margin-bottom:6px;}
.goal-btn .gn{font-size:13px;font-weight:600;color:var(--text);}
.goal-btn .gd{font-size:11px;color:var(--muted);margin-top:2px;}
.goal-btn:hover{border-color:#e8e8ec40;}
.goal-btn.on{background:var(--s3);border-color:var(--text);}

/* ── TOAST ── */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--acc);color:#0c0c0f;padding:9px 20px;border-radius:20px;font-weight:600;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:#000000cc;z-index:200;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--s1);width:100%;border-radius:20px 20px 0 0;padding:18px 16px;max-height:75vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--s3);border-radius:2px;margin:0 auto 14px;}

/* ── POST COMPOSER ── */
.composer{background:var(--s1);border:1px solid #ffffff08;border-radius:var(--r);padding:14px;margin-bottom:12px;}
.composer-header{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.compose-ta{background:var(--s2);border:1px solid #ffffff0a;border-radius:9px;padding:10px 13px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;width:100%;resize:none;outline:none;line-height:1.6;min-height:72px;}
.compose-ta:focus{border-color:var(--acc2);}
.attach-preview{background:var(--s2);border:1px solid #e8e8ec30;border-radius:10px;padding:12px;margin-bottom:10px;position:relative;}
.attach-preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.attach-label{font-size:11px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px;}
.attach-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0;}
.attach-ex-list{display:flex;flex-direction:column;gap:4px;}
.attach-ex-item{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #ffffff06;}
.attach-ex-item:last-child{border-bottom:none;}
.attach-ex-name{color:var(--muted2);}
.attach-ex-val{color:var(--text);font-weight:500;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px;}

/* ── MISC ── */
.divider{border:none;border-top:1px solid #ffffff06;margin:12px 0;}
.empty-state{text-align:center;color:var(--muted);padding:36px 16px;font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:8px;}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:600;}
.log-entry{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #ffffff05;}
.log-entry:last-child{border-bottom:none;}
.log-date-badge{min-width:42px;text-align:center;background:var(--s2);border-radius:8px;padding:5px 3px;}
.ldd{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text);line-height:1;}
.ldm{font-size:9px;color:var(--muted);text-transform:uppercase;}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--s3);color:var(--muted2);}
input[type=range]{accent-color:var(--acc);width:100%;}
select.inp{appearance:none;}

/* ── MUSCLE COLOR DOTS ── */
.muscle-dots{display:flex;gap:3px;justify-content:center;margin-top:2px;flex-wrap:wrap;}
.muscle-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.cal-day.hw .muscle-dots{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);}
.cal-day.hw{padding-bottom:10px;}
/* log-entry color bar */
.log-color-bar{width:4px;border-radius:2px;align-self:stretch;flex-shrink:0;min-height:40px;}
/* today summary bar */
.today-summary{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--s3);border-radius:10px;padding:9px 13px;overflow-x:auto;}
.today-summary::-webkit-scrollbar{display:none;}
.summary-label{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.summary-muscle{display:flex;align-items:center;gap:5px;flex-shrink:0;background:var(--s2);border-radius:20px;padding:4px 10px;}
.summary-muscle-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.summary-muscle-name{font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.3px;}
.summary-rest{font-size:12px;color:var(--muted);flex-shrink:0;}
/* setup screen */
#setup-screen{position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto;padding:24px 20px 40px;max-width:480px;margin:0 auto;}
.setup-logo{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:var(--text);letter-spacing:4px;text-transform:uppercase;margin-bottom:4px;}
.setup-sub{font-size:14px;color:var(--muted2);margin-bottom:28px;}
.step-dots{display:flex;gap:6px;margin-bottom:24px;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--s3);transition:all .3s;}
.step-dot.active{background:var(--text);width:20px;border-radius:4px;}
</style>
</head>
<body>


<!-- ═══════════════════════════════════════════ AUTH ═══ -->
<div id="auth-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto;padding:48px 24px 40px;max-width:480px;margin:0 auto;">
  <div style="font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:var(--text);letter-spacing:4px;margin-bottom:4px;">GRIND<span style="color:var(--muted);">.</span></div>
  <div style="font-size:14px;color:var(--muted2);margin-bottom:40px;">毎日の積み重ねが、体を変える。</div>

  <div id="auth-tabs" style="display:flex;gap:0;background:var(--s2);border-radius:10px;padding:4px;margin-bottom:24px;">
    <button id="tab-login" onclick="showAuthTab('login')" style="flex:1;padding:9px;border:none;border-radius:7px;background:var(--s1);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;">ログイン</button>
    <button id="tab-signup" onclick="showAuthTab('signup')" style="flex:1;padding:9px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;">新規登録</button>
  </div>

  <!-- ログイン -->
  <div id="auth-login">
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
      <input class="inp" id="login-email" type="email" placeholder="メールアドレス">
      <input class="inp" id="login-password" type="password" placeholder="パスワード">
    </div>
    <button class="btn btn-acc btn-full" onclick="doLogin()" style="font-size:15px;padding:14px;">ログイン</button>
    <div id="auth-error" style="color:var(--danger);font-size:12px;margin-top:10px;text-align:center;display:none;"></div>
  </div>

  <!-- 新規登録（セットアップフローへ） -->
  <div id="auth-signup" style="display:none;">
    <div style="color:var(--muted2);font-size:13px;line-height:1.7;margin-bottom:20px;">「新規登録」を押すとプロフィール設定画面に進みます。</div>
    <button class="btn btn-acc btn-full" onclick="startSignup()" style="font-size:15px;padding:14px;">プロフィールを設定して登録</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════ SETUP ═══ -->
<div id="setup-screen">
  <div class="setup-logo">GRIND<span style="color:var(--muted);">.</span></div>
  <div class="setup-sub">毎日の積み重ねが、体を変える。</div>
  <div class="step-dots" id="step-dots"></div>
  <div id="setup-steps"></div>
</div>

<!-- ═══════════════════════════════════════════ MAIN APP ═══ -->
<div id="app" style="display:none;">
  <!-- Top bar -->
  <div class="top-bar" id="top-bar">
    <div class="app-logo">GRIND<span style="color:var(--acc3);">.</span></div>
    <div class="top-bar-actions" id="top-bar-actions"></div>
  </div>
  <!-- Today's muscle summary (全ビュー共通) -->
  <div id="today-summary-bar" style="display:none;padding:0 16px 10px;background:var(--bg);"></div>

  <div class="views">

    <!-- ─── FEED ─── -->
    <div class="view active" id="view-feed">
      <div class="view-pad">
        <!-- Composer -->
        <div class="composer" id="composer">
          <div class="composer-header">
            <div class="avatar" id="composer-avatar" style="background:var(--s3);"></div>
            <textarea class="compose-ta" id="compose-ta" placeholder="トレーニングをシェアしよう..."></textarea>
          </div>
          <!-- attach-preview-box はJS側で動的挿入 -->
          <div style="display:flex;align-items:center;gap:8px;">
            <button class="btn btn-ghost btn-sm" onclick="attachLastWorkout()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              記録を添付
            </button>
            <button class="btn btn-acc btn-sm" style="margin-left:auto;" onclick="createPost()">投稿</button>
          </div>
        </div>
        <!-- Feed -->
        <div id="feed-list"></div>
      </div>
    </div>

    <!-- ─── RECORD ─── -->
    <div class="view" id="view-record">
      <div class="view-pad">
        <div class="section-title">TODAY'S WORKOUT</div>
        <div class="label" style="margin-bottom:8px;">部位を選択</div>
        <div class="muscle-grid" id="muscle-grid"></div>
        <div id="exercise-section" style="display:none;">
          <div class="label" style="margin-bottom:8px;">種目を選択（複数可）</div>
          <div id="exercise-chips"></div>
          <!-- ライブレコーダー -->
          <div id="live-recorder-wrap" style="display:none;margin-top:14px;">
            <div class="live-recorder" id="live-recorder">
              <!-- タブ -->
              <div class="live-ex-tab" id="live-ex-tabs"></div>
              <!-- セット入力エリア -->
              <div class="live-set-area">
                <div class="set-history" id="live-set-history"></div>
                <div id="prev-hint" class="prev-hint"></div>
                <div class="set-input-row">
                  <div>
                    <input class="inp-big" type="number" id="inp-w" placeholder="—" min="0" step="0.5" inputmode="decimal">
                    <div class="inp-big-label">重量 (kg)</div>
                  </div>
                  <div>
                    <input class="inp-big" type="number" id="inp-r" placeholder="—" min="1" inputmode="numeric">
                    <div class="inp-big-label">回数 (reps)</div>
                  </div>
                </div>
                <button class="add-set-btn" onclick="addSet()" id="add-set-btn">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                  セット追加
                </button>
                <div id="rest-timer-wrap" style="display:none;">
                  <div class="rest-timer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>レスト</span>
                    <span class="rest-timer-val" id="rest-val">0:00</span>
                    <button style="margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;" onclick="resetRestTimer()">リセット</button>
                  </div>
                </div>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
              <button class="btn btn-ghost btn-full" onclick="clearRecord()">クリア</button>
              <button class="btn btn-acc btn-full" onclick="saveWorkout()" style="font-size:15px;padding:13px;">💪 保存</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── AI COACH ─── -->
    <div class="view" id="view-ai">
      <div class="view-pad">
        <div class="section-title">AI COACH</div>

        <!-- Today's advice -->
        <div class="ai-hero" id="ai-hero">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div class="ai-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              AI COACH
            </div>
            <button class="btn btn-ghost btn-xs" onclick="generateAdvice()" id="advice-btn">今日のアドバイスを見る</button>
          </div>
          <div id="ai-advice-text" class="ai-msg" style="color:var(--muted);font-size:13px;">ボタンを押してアドバイスを取得してください</div>
        </div>

        <!-- Tasks -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div class="label">今日のタスク</div>
          <button class="btn btn-ghost btn-xs" onclick="generateTasks()">✨ 生成</button>
        </div>
        <div id="task-list"><div class="empty-state" style="padding:20px 0;"><div style="font-size:11px;color:var(--muted);">「生成」を押してタスクを取得</div></div></div>

        <!-- Menu suggestion -->
        <div style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div class="label">食事メニュー提案</div>
            <button class="btn btn-ghost btn-xs" onclick="generateMenu()">✨ 生成</button>
          </div>
          <div id="menu-suggestion"></div>
        </div>

        <!-- Chat with AI -->
        <div style="margin-top:16px;">
          <div class="label" style="margin-bottom:8px;">コーチに質問</div>
          <div id="ai-chat-log" style="max-height:220px;overflow-y:auto;margin-bottom:8px;"></div>
          <div style="display:flex;gap:8px;">
            <input class="inp" id="ai-q-inp" placeholder="例：ベンチプレスが伸び悩んでいます..." onkeydown="if(event.key==='Enter')askAI()">
            <button class="btn btn-acc btn-sm" onclick="askAI()" style="flex-shrink:0;">送信</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── HISTORY / CALENDAR ─── -->
    <div class="view" id="view-history">
      <div class="view-pad">
        <!-- Tab switcher -->
        <div style="display:flex;gap:6px;margin-bottom:14px;">
          <button class="fbtn on" id="htab-history" onclick="switchHistoryTab('history')">履歴</button>
          <button class="fbtn" id="htab-calendar" onclick="switchHistoryTab('calendar')">カレンダー</button>
          <button class="fbtn" id="htab-progress" onclick="switchHistoryTab('progress')">推移</button>
        </div>

        <!-- History sub-view -->
        <div id="hsub-history">
          <div class="stats-row" id="stats-row"></div>
          <div class="card card-sm" style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span class="label">直近7日ストリーク</span>
              <span style="font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--muted2);" id="streak-count">0 days</span>
            </div>
            <div class="streak-bar" id="streak-bar"></div>
          </div>
          <div id="history-list"></div>
        </div>

        <!-- Calendar sub-view -->
        <div id="hsub-calendar" style="display:none;">
          <div class="month-nav">
            <button class="icon-btn" onclick="changeMonth(-1)">‹</button>
            <div class="month-title" id="cal-month-title"></div>
            <button class="icon-btn" onclick="changeMonth(1)">›</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div id="cal-detail"></div>
        </div>

        <!-- Progress sub-view -->
        <div id="hsub-progress" style="display:none;">
          <div class="filter-row" id="progress-filters"></div>
          <div class="card" style="margin-bottom:10px;">
            <div class="label" style="margin-bottom:6px;">最大重量推移 (kg)</div>
            <div class="chart-wrap"><canvas id="progress-chart"></canvas></div>
          </div>
          <div class="card">
            <div class="label" style="margin-bottom:6px;">総ボリューム (kg×rep×set)</div>
            <div class="chart-wrap"><canvas id="volume-chart"></canvas></div>
          </div>
          <div id="progress-empty" class="empty-state" style="display:none;">
            <div class="empty-icon">📊</div><div>記録が増えると表示されます</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── PROFILE ─── -->
    <div class="view" id="view-profile">
      <div class="profile-hero" id="profile-hero"></div>
      <div class="view-pad" style="padding-top:14px;">
        <div style="display:flex;gap:8px;margin-bottom:14px;" id="profile-actions"></div>
        <!-- My posts -->
        <div class="label" style="margin-bottom:10px;">投稿</div>
        <div id="my-posts-list"></div>
      </div>
    </div>

  </div><!-- end .views -->

  <!-- Bottom NAV -->
  <nav class="nav">
    <button class="nav-btn active" onclick="switchView('feed')" id="nav-feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      フィード
    </button>
    <button class="nav-btn" onclick="switchView('record')" id="nav-record">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      記録
    </button>
    <button class="nav-btn" onclick="switchView('ai')" id="nav-ai">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      AIコーチ
    </button>
    <button class="nav-btn" onclick="switchView('history')" id="nav-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
      記録帳
    </button>
    <button class="nav-btn" onclick="switchView('profile')" id="nav-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      プロフィール
    </button>
  </nav>
</div>

<!-- Comment modal -->
<div class="modal-overlay" id="comment-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="label" style="margin-bottom:12px;">コメント</div>
    <div id="modal-comments"></div>
    <div class="comment-input-row" style="padding:8px 0;">
      <div class="avatar-sm" id="modal-avatar" style="background:var(--s3);"></div>
      <input class="comment-inp" id="modal-comment-inp" placeholder="コメントを入力..." onkeydown="if(event.key==='Enter')submitComment()">
      <button class="btn btn-acc btn-xs" onclick="submitComment()">送信</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const MOCK_USERS = [

// ─── ユーザーデータをロード ───
async function loadUserData(userId) {
  try {
    // プロフィール
    const { data: prof } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (prof) {
      st.profile = {
        id: userId,
        name: prof.name,
        avatar: prof.avatar || '💪',
        photoUrl: prof.photo_url || null,
        color: '#9898a8',
        height: prof.height_cm,
        weight: prof.weight_kg,
        age: prof.age,
        gender: prof.gender,
        goal: prof.goal,
        experience: prof.experience,
        followers: prof.followers || 0,
        following: prof.following || 0,
      };
    }
    // ワークアウト（セット含む）
    const { data: workouts } = await sb
      .from('workouts')
      .select('*, workout_sets(*)')
      .eq('user_id', userId)
      .order('date', { ascending: false })
      .limit(100);
    if (workouts) {
      st.workouts = workouts.map(w => ({
        id: w.id,
        date: w.date,
        muscle: w.muscle,
        muscleLabel: w.muscle_label,
        exercises: w.exercises,
        sets: (w.workout_sets || []).map(s => ({
          exercise: s.exercise,
          weight: s.weight_kg,
          reps: s.reps,
          sets: s.sets,
        }))
      }));
    }
    // フィード投稿（全ユーザー）
    await loadFeed();
  } catch(e) {
    console.error('loadUserData error:', e);
  }
}

// ─── フィードをロード ───
async function loadFeed() {
  try {
    const { data: posts } = await sb
      .from('posts')
      .select(`
        *,
        profiles(id, name, avatar, photo_url, goal),
        likes(user_id),
        comments(id, body, created_at, profiles(name, avatar, photo_url))
      `)
      .order('created_at', { ascending: false })
      .limit(30);
    if (posts) {
      const myId = st.profile?.id;
      const remotePosts = posts.map(p => ({
        id: p.id,
        userId: p.user_id,
        _profile: p.profiles,
        text: p.body,
        workout: null,
        likes: p.likes?.length || 0,
        liked: p.likes?.some(l => l.user_id === myId) || false,
        comments: (p.comments || []).map(c => ({
          userId: c.profiles?.name || '?',
          text: c.body,
          ts: timeAgo(c.created_at),
          _profile: c.profiles,
        })),
        ts: timeAgo(p.created_at),
      }));
      st.posts = [...MOCK_POSTS, ...remotePosts];
    }
  } catch(e) { console.error('loadFeed error:', e); }
}

function timeAgo(iso) {
  if (!iso) return '';
  const sec = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (sec < 60) return 'たった今';
  if (sec < 3600) return Math.floor(sec/60) + '分前';
  if (sec < 86400) return Math.floor(sec/3600) + '時間前';
  return Math.floor(sec/86400) + '日前';
}

let setupStep = 0;
function renderSetup() {
  const dots = document.getElementById('step-dots');
  const steps = document.getElementById('setup-steps');
  dots.innerHTML = SETUP_STEPS.map((_,i)=>`<div class="step-dot ${i===setupStep?'active':''}"></div>`).join('');
  const s = SETUP_STEPS[setupStep];
  steps.innerHTML = `
    <div style="font-size:20px;font-weight:600;margin-bottom:18px;">${s.title}</div>
    ${s.render()}
    <div style="display:flex;gap:10px;margin-top:20px;">
      ${setupStep>0?`<button class="btn btn-ghost" onclick="prevStep()">← 戻る</button>`:''}
      <button class="btn btn-acc" style="flex:1;" onclick="nextStep()">
        ${setupStep===SETUP_STEPS.length-1 ? '🚀 はじめる' : '次へ →'}
      </button>
    </div>
  `;
}
function prevStep() { setupStep--; renderSetup(); }
let _submitting = false;
async function nextStep() {
  if(_submitting) return;
  const s = SETUP_STEPS[setupStep];
  if(!s.validate()) return;
  if(setupStep === SETUP_STEPS.length-1) {
    _submitting = true;
    await finishSetup();
    _submitting = false;
    return;
  }
  setupStep++;
  renderSetup();
}
function selectEmoji(el, e) {
  document.querySelectorAll('#setup-steps .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const prev = document.getElementById('s-avatar-preview');
  if(prev) { prev.innerHTML=`<span style="font-size:28px;">${e}</span>`; }
}
function previewSetupPhoto(event) {
  const file = event.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const prev = document.getElementById('s-avatar-preview');
    if(prev) prev.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    // 絵文字選択を解除
    document.querySelectorAll('#setup-steps .chip').forEach(c=>c.classList.remove('on'));
  };
  reader.readAsDataURL(file);
}
function selectGoal(el, g) {
  document.querySelectorAll('#setup-steps .goal-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  el.dataset.goal = g;
}
function selectExp(el, e) {
  document.querySelectorAll('#setup-steps .goal-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  el.dataset.exp = e;
}
async function finishSetup() {
  const email = st._setup.email;

    email,

  // プロフィールをDBに保存
  const userId = data.user?.id;
  if (userId) {
    await sb.from('profiles').upsert({
      id: userId,

    });

}

function getMuscleColor(muscleId) {
  return MUSCLES.find(m=>m.id===muscleId)?.color || '#888';
}

// 日付→その日に鍛えた部位一覧（重複なし）
function getMusclesForDate(dateStr) {
  const ws = st.workouts.filter(w=>w.date===dateStr);
  const seen = new Set();
  const result = [];
  ws.forEach(w=>{ if(!seen.has(w.muscle)){ seen.add(w.muscle); result.push(w.muscle); }});
  return result;
}

// ─── 今日のサマリーバー ───
function renderTodaySummary() {
  const today = new Date().toISOString().split('T')[0];
  const muscles = getMusclesForDate(today);
  const bar = document.getElementById('today-summary-bar');
  if(!muscles.length) { bar.style.display='none'; return; }
  bar.style.display='block';

  // 部位ごとのセット数・総vol
  const todayWs = st.workouts.filter(w=>w.date===today);
  const totalSets = todayWs.reduce((a,w)=>a+w.sets.length,0);
  const totalVol  = Math.round(todayWs.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*s.sets,0),0));

  bar.innerHTML = `<div class="today-summary">
    <span class="summary-label">今日</span>
    ${muscles.map(mid=>{
      const m = MUSCLES.find(m=>m.id===mid);
      return `<div class="summary-muscle" style="border:1px solid ${m.color}40;">
        <div class="summary-muscle-dot" style="background:${m.color};box-shadow:0 0 5px ${m.color}80;"></div>
        <span class="summary-muscle-name" style="color:${m.color};">${m.label}</span>
      </div>`;
    }).join('')}
    <span class="summary-rest" style="margin-left:auto;">${totalSets}set・${totalVol}kg</span>
  </div>`;
}

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        シェア
      </button>
    </div>
  </div>`;
}

async function toggleLike(id) {
  const p = st.posts.find(p=>p.id===id);
  if(!p) return;
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  renderFeed();
  // リモートに反映（ローカル投稿は除外）
  if(!String(id).startsWith('local_') && !String(id).startsWith('p')) {
    try {
      if(p.liked) {
        await sb.from('likes').insert({ user_id: st.profile.id, post_id: id });
      } else {
        await sb.from('likes').delete().eq('user_id', st.profile.id).eq('post_id', id);
      }
    } catch(e) { console.error('toggleLike error:', e); }
  }
}

function openComments(id) {
  st.commentTargetId = id;
  const p = st.posts.find(p=>p.id===id);
  if(!p) return;
  const mc = document.getElementById('modal-comments');
  mc.innerHTML = p.comments.length ? p.comments.map(c=>{
    const u = c.userId==='me'?st.profile:(MOCK_USERS.find(u=>u.id===c.userId)||{name:'?',avatar:'?',color:'#666'});
    return `<div class="comment-item">
      <div class="avatar-sm" style="background:${u.color}20;color:${u.color};">${u.avatar}</div>
      <div class="comment-body">
        <div class="comment-name">${u.name} <span style="color:var(--muted);font-weight:400;font-size:11px;">${c.ts}</span></div>
        <div class="comment-text">${c.text}</div>
      </div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);font-size:13px;padding:12px 0;">まだコメントがありません</div>';
  document.getElementById('comment-modal').classList.add('open');
  document.getElementById('comment-modal').onclick = e => { if(e.target===e.currentTarget) closeComments(); };
}
function closeComments() { document.getElementById('comment-modal').classList.remove('open'); }
async function submitComment() {
  const inp = document.getElementById('modal-comment-inp');
  const txt = inp.value.trim();
  if(!txt || !st.commentTargetId) return;
  const p = st.posts.find(p=>p.id===st.commentTargetId);
  if(!p) return;
  p.comments.push({userId:'me', text:txt, ts:'たった今'});
  inp.value='';
  openComments(st.commentTargetId);
  renderFeed();
  // リモートに保存
  if(!String(st.commentTargetId).startsWith('local_') && !String(st.commentTargetId).startsWith('p')) {
    try {
      await sb.from('comments').insert({
        user_id: st.profile.id,
        post_id: st.commentTargetId,
        body: txt,
      });
    } catch(e) { console.error('submitComment error:', e); }
  }
}
function sharePost() { showToast('リンクをコピーしました！'); }

function attachLastWorkout() {
  const last = st.workouts[st.workouts.length-1];
  if(!last) { showToast('記録がありません。先にトレーニングを記録してください'); return; }
  st.attachedWorkout = last;
  renderAttachPreview();
  showToast('トレーニングを添付しました');
}

function renderAttachPreview() {
  // 既存のプレビューを削除
  const old = document.getElementById('attach-preview-box');
  if(old) old.remove();
  if(!st.attachedWorkout) return;
  const w = st.attachedWorkout;
  const muscle = MUSCLES.find(m=>m.id===w.muscle);
  const mc = muscle?.color || '#e8e8ec';
  // セットをまとめる（種目ごとにmax重量と総set数）
  const exMap = {};
  w.sets.forEach(s=>{ if(!exMap[s.exercise]) exMap[s.exercise]={maxW:0,totalSets:0,reps:s.reps}; exMap[s.exercise].maxW=Math.max(exMap[s.exercise].maxW,s.weight); exMap[s.exercise].totalSets++; });
  const preview = document.createElement('div');
  preview.id = 'attach-preview-box';
  preview.className = 'attach-preview';
  preview.innerHTML = `
    <div class="attach-preview-header">
      <div class="attach-label">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        ${muscle?.label || ''}トレを添付
        <span style="font-size:10px;color:var(--muted);font-weight:400;">${w.date}</span>
      </div>
      <button class="attach-remove" onclick="removeAttach()">✕</button>
    </div>
    <div class="attach-ex-list">
      ${Object.entries(exMap).map(([name,info])=>`
        <div class="attach-ex-item">
          <span class="attach-ex-name">${name}</span>
          <span class="attach-ex-val" style="color:${mc};">${info.maxW}kg × ${info.totalSets}set</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:6px;font-size:11px;color:var(--muted);">合計 ${w.sets.length}セット ／ vol: ${Math.round(w.sets.reduce((a,s)=>a+s.weight*s.reps,0))}kg</div>`;
  // composerのfooterの前に挿入
  const composer = document.getElementById('composer');
  const footer = composer.querySelector('div:last-child');
  composer.insertBefore(preview, footer);
}

function removeAttach() {
  st.attachedWorkout = null;
  const p = document.getElementById('attach-preview-box');
  if(p) p.remove();
}

async function createPost() {
  const ta = document.getElementById('compose-ta');
  const txt = ta.value.trim();
  if(!txt) { showToast('テキストを入力してください'); return; }

  let workoutId = null;
  let workoutPreview = null;
  if(st.attachedWorkout) {
    const w = st.attachedWorkout;
    workoutId = w.id || null;
    const exMap = {};
    w.sets.forEach(s=>{ if(!exMap[s.exercise]) exMap[s.exercise]={maxW:0,totalSets:0,reps:s.reps}; exMap[s.exercise].maxW=Math.max(exMap[s.exercise].maxW,s.weight); exMap[s.exercise].totalSets++; });
    workoutPreview = {
      muscle: MUSCLES.find(m=>m.id===w.muscle)?.label||w.muscle,
      exercises: Object.entries(exMap).map(([name,info])=>({name, weight:info.maxW, reps:info.reps, sets:info.totalSets}))
    };
  }

  try {
    const { data: pData, error } = await sb.from('posts').insert({
      user_id: st.profile.id,
      body: txt,
      workout_id: workoutId,
    }).select().single();
    if (error) throw error;

    // ローカルに即反映
    st.posts.unshift({
      id: pData.id,
      userId: 'me',
      text: txt,
      workout: workoutPreview,
      likes: 0,
      liked: false,
      comments: [],
      ts: 'たった今',
    });
  } catch(e) {
    // オフライン時はローカルのみ
    st.posts.unshift({ id:'local_'+Date.now(), userId:'me', text:txt, workout:workoutPreview, likes:0, liked:false, comments:[], ts:'たった今' });
  }

  ta.value='';
  removeAttach();
  renderFeed();
  showToast('投稿しました！');
}

// ═══════════════ RECORD ═══════════════
let restTimerInterval = null, restSeconds = 0;

function escQ(s){ return s.replace(/'/g,"\\'"); }

function renderMuscleGrid() {
  document.getElementById('muscle-grid').innerHTML = MUSCLES.map(m =>
    `<button class="m-btn ${st.selectedMuscle===m.id?'on':''}" onclick="selectMuscle('${m.id}')"
      style="${st.selectedMuscle===m.id?`background:${m.color}12;`:''}">
      ${dumbbellSVG(st.selectedMuscle===m.id ? m.color : '#5a5a72')}
      <span style="${st.selectedMuscle===m.id?`color:${m.color};`:''}">${m.label}</span>
      <div class="db-bar" style="background:${m.color};${st.selectedMuscle===m.id?'opacity:1;':''}"></div>
    </button>`).join('');
}

function selectMuscle(id) {
  st.selectedMuscle=id; st.selectedExercises=[]; st.activeExercise=null; st.pendingSets={};
  stopRestTimer();
  renderMuscleGrid();
  renderExerciseChips();
  document.getElementById('exercise-section').style.display='block';
  document.getElementById('live-recorder-wrap').style.display='none';
}

function renderExerciseChips() {
  if(!st.selectedMuscle) return;
  document.getElementById('exercise-chips').innerHTML =
    `<div class="chip-row">${EXERCISES[st.selectedMuscle].map(ex=>
      `<span class="chip ${st.selectedExercises.includes(ex)?'on':''}" onclick="toggleExercise('${escQ(ex)}')">${ex}</span>`
    ).join('')}</div>`;
}

function toggleExercise(ex) {
  const i = st.selectedExercises.indexOf(ex);
  if(i===-1) { st.selectedExercises.push(ex); if(!st.pendingSets[ex]) st.pendingSets[ex]=[]; }
  else { st.selectedExercises.splice(i,1); delete st.pendingSets[ex]; }
  st.activeExercise = st.selectedExercises.length
    ? (st.selectedExercises.includes(st.activeExercise) ? st.activeExercise : st.selectedExercises[0])
    : null;
  renderExerciseChips();
  if(st.selectedExercises.length > 0) {
    document.getElementById('live-recorder-wrap').style.display='block';
    renderLiveRecorder();
  } else {
    document.getElementById('live-recorder-wrap').style.display='none';
  }
}

function renderLiveRecorder() {
  renderLiveRecorderTabs();
  renderSetHistory();
  renderPrevHint();
}

function renderLiveRecorderTabs() {
  const tabs = document.getElementById('live-ex-tabs');
  tabs.innerHTML = st.selectedExercises.map(ex => {
    const cnt = (st.pendingSets[ex]||[]).length;
    const isActive = st.activeExercise === ex;
    return `<button class="ex-tab-btn ${isActive?'active':''}" onclick="switchExTab('${escQ(ex)}')">${ex}${cnt>0?` <span style="font-size:10px;background:${isActive?'rgba(0,0,0,.2)':'#e8e8ec20'};color:${isActive?'currentColor':'var(--acc)'};border-radius:8px;padding:1px 6px;">${cnt}</span>`:''}</button>`;
  }).join('');
}

function switchExTab(ex) {
  st.activeExercise = ex;
  document.getElementById('inp-w').value='';
  document.getElementById('inp-r').value='';
  renderLiveRecorder();
}

function renderSetHistory() {
  const hist = document.getElementById('live-set-history');
  const sets = st.pendingSets[st.activeExercise] || [];
  if(!sets.length) {
    hist.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:4px 0 8px;">最初のセットを追加しましょう 💪</div>`;
    return;
  }
  hist.innerHTML = sets.map((s,i) => {
    const vol = Math.round(s.weight * s.reps);
    return `<div class="set-done-row">
      <div class="set-done-num">${i+1}</div>
      <div class="set-done-val">${s.weight}kg × ${s.reps}回</div>
      <div class="set-done-vol">vol: ${vol}kg</div>
      <button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 0 0 6px;" onclick="removeSetLive(${i})">✕</button>
    </div>`;
  }).join('');
}

function renderPrevHint() {
  const hint = document.getElementById('prev-hint');
  const sets = st.pendingSets[st.activeExercise] || [];
  const prev = [...st.workouts].reverse().find(w => w.exercises.includes(st.activeExercise));
  const nextNum = sets.length + 1;
  let txt = `セット ${nextNum}`;
  let pw = null, pr = null;
  if(prev) {
    const ps = prev.sets.filter(s=>s.exercise===st.activeExercise);
    const ref = ps[sets.length] || ps[ps.length-1];
    if(ref) { pw=ref.weight; pr=ref.reps; txt += ` ／ 前回: <span>${ref.weight}kg × ${ref.reps}回</span>`; }
  }
  hint.innerHTML = txt;
  const wEl = document.getElementById('inp-w');
  const rEl = document.getElementById('inp-r');
  if(!wEl.value) { wEl.placeholder = pw || '60'; }
  if(!rEl.value) { rEl.placeholder = pr || '10'; }
}

function addSet() {
  const wEl = document.getElementById('inp-w');
  const rEl = document.getElementById('inp-r');
  const w = parseFloat(wEl.value) || parseFloat(wEl.placeholder) || 0;
  const r = parseInt(rEl.value) || parseInt(rEl.placeholder) || 0;
  if(!w || !r || !st.activeExercise) { showToast('重量と回数を入力してください'); return; }
  if(!st.pendingSets[st.activeExercise]) st.pendingSets[st.activeExercise]=[];
  st.pendingSets[st.activeExercise].push({weight:w, reps:r, sets:1});
  wEl.value=''; rEl.value='';
  const btn = document.getElementById('add-set-btn');
  btn.innerHTML='✓ 追加しました！'; btn.style.background='#4a4a52';
  setTimeout(()=>{
    btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>セット追加';
    btn.style.background='';
  }, 900);
  startRestTimer();
  renderLiveRecorder();
}

function removeSetLive(idx) {
  (st.pendingSets[st.activeExercise]||[]).splice(idx,1);
  renderLiveRecorder();
}

function startRestTimer() {
  restSeconds=0;
  document.getElementById('rest-timer-wrap').style.display='block';
  clearInterval(restTimerInterval);
  restTimerInterval = setInterval(()=>{
    restSeconds++;
    const m=Math.floor(restSeconds/60), s=restSeconds%60;
    const el=document.getElementById('rest-val');
    if(el) el.textContent=`${m}:${String(s).padStart(2,'0')}`;
  },1000);
}
function stopRestTimer(){ clearInterval(restTimerInterval); restTimerInterval=null; }
function resetRestTimer(){ stopRestTimer(); restSeconds=0; document.getElementById('rest-timer-wrap').style.display='none'; }

function clearRecord() {
  st.selectedMuscle=null; st.selectedExercises=[]; st.activeExercise=null; st.pendingSets={};
  stopRestTimer();
  renderMuscleGrid();
  document.getElementById('exercise-section').style.display='none';
  document.getElementById('live-recorder-wrap').style.display='none';
}

async function saveWorkout() {
  const total=st.selectedExercises.reduce((a,ex)=>a+(st.pendingSets[ex]||[]).length,0);
  if(!st.selectedMuscle||total===0){showToast('種目とセットを入力してください');return;}
  const muscle=MUSCLES.find(m=>m.id===st.selectedMuscle);
  const today=new Date().toISOString().split('T')[0];
  const sets=[];
  st.selectedExercises.forEach(ex=>(st.pendingSets[ex]||[]).forEach(s=>sets.push({exercise:ex,...s})));

  try {
    // workoutsテーブルに保存
    const { data: wData, error: wErr } = await sb.from('workouts').insert({
      user_id: st.profile.id,
      date: today,
      muscle: st.selectedMuscle,
      muscle_label: muscle.label,
      exercises: st.selectedExercises,
    }).select().single();
    if (wErr) throw wErr;

    // workout_setsに保存
    const setsToInsert = sets.map(s => ({
      workout_id: wData.id,
      exercise: s.exercise,
      weight_kg: s.weight,
      reps: s.reps,
      sets: s.sets || 1,
    }));
    const { error: sErr } = await sb.from('workout_sets').insert(setsToInsert);
    if (sErr) throw sErr;

    // ローカルstateにも反映
    st.workouts.unshift({
      id: wData.id,
      date: today,
      muscle: st.selectedMuscle,
      muscleLabel: muscle.label,
      exercises: [...st.selectedExercises],
      sets,
    });
  } catch(e) {
    console.error('saveWorkout error:', e);
    // オフライン時はローカルに保存
    st.workouts.unshift({date:today,muscle:st.selectedMuscle,muscleLabel:muscle.label,exercises:[...st.selectedExercises],sets});
    showToast('オフラインのためローカルに保存しました');
  }

  stopRestTimer(); clearRecord();
  renderTodaySummary();
  showToast('🎉 トレーニングを保存しました！');
  setTimeout(()=>{
    if(confirm('トレーニングをフィードに投稿しますか？')){
      switchView('feed'); attachLastWorkout();
      document.getElementById('compose-ta').focus();
    }
  },300);
}

// ═══════════════ HISTORY ═══════════════
function switchHistoryTab(t) {
  st.historyTab=t;
  ['history','calendar','progress'].forEach(tab=>{
    document.getElementById('htab-'+tab).classList.toggle('on',tab===t);
    document.getElementById('hsub-'+tab).style.display=tab===t?'block':'none';
  });
  if(t==='calendar') renderCalendar();
  if(t==='progress') renderProgress();
  if(t==='history') renderHistory();
}

function renderHistory() {
  const total=st.workouts.length;
  const totalVol=st.workouts.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*s.sets,0),0);
  const totalSets=st.workouts.reduce((a,w)=>a+w.sets.length,0);
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-c"><div class="stat-v">${total}</div><div class="stat-l">総回数</div></div>
    <div class="stat-c"><div class="stat-v">${totalSets}</div><div class="stat-l">総セット</div></div>
    <div class="stat-c"><div class="stat-v">${Math.round(totalVol/1000)}k</div><div class="stat-l">総vol</div></div>`;

  // ストリーク
  const wDates=new Set(st.workouts.map(w=>w.date));
  let s=0,dots='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const muscles=[...new Set(st.workouts.filter(w=>w.date===ds).map(w=>w.muscle))];
    if(muscles.length){
      // ストリークバーも部位カラーグラデーションに
      const colors=muscles.map(getMuscleColor);
      const grad=colors.length>1?`linear-gradient(90deg,${colors.join(',')})`:`${colors[0]}`;
      dots+=`<div class="sd done" style="background:${grad};opacity:1;"></div>`;
    } else {
      dots+=`<div class="sd"></div>`;
    }
  }
  for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);if(wDates.has(d.toISOString().split('T')[0]))s++;else break;}
  document.getElementById('streak-bar').innerHTML=dots;
  document.getElementById('streak-count').textContent=`${s} days`;

  const list=document.getElementById('history-list');
  if(!st.workouts.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">🏋️</div><div>まだ記録がありません</div></div>`;
    return;
  }

  // 日付でグループ化
  const byDate={};
  st.workouts.forEach(w=>{
    if(!byDate[w.date]) byDate[w.date]=[];
    byDate[w.date].push(w);
  });
  const sortedDates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));

  list.innerHTML=sortedDates.map(dateStr=>{
    const ws=byDate[dateStr];
    const d=new Date(dateStr);
    const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    const muscles=[...new Set(ws.map(w=>w.muscle))];
    const totalSetCount=ws.reduce((a,w)=>a+w.sets.length,0);
    const totalVolDay=Math.round(ws.reduce((a,w)=>a+w.sets.reduce((b,s)=>b+s.weight*s.reps*s.sets,0),0));

    // カラーバー：複数部位ならグラデーション
    const barColors=muscles.map(getMuscleColor);
    const barStyle=barColors.length>1
      ?`background:linear-gradient(180deg,${barColors.join(',')});`
      :`background:${barColors[0]};`;

    // 部位ドット群
    const muscleDots=muscles.map(mid=>{
      const m=MUSCLES.find(m=>m.id===mid);
      return `<span style="display:inline-flex;align-items:center;gap:4px;background:${m.color}15;border:1px solid ${m.color}40;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;color:${m.color};">
        <span style="width:6px;height:6px;border-radius:50%;background:${m.color};display:inline-block;"></span>${m.label}
      </span>`;
    }).join('');

    return `<div class="log-entry" onclick="switchHistoryTab('calendar');showCalDay('${dateStr}');" style="cursor:pointer;">
      <div class="log-color-bar" style="${barStyle}border-radius:2px;"></div>
      <div class="log-date-badge"><div class="ldd">${d.getDate()}</div><div class="ldm">${mon}</div></div>
      <div style="flex:1;">
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">${muscleDots}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;">${ws.flatMap(w=>w.exercises).map(e=>`<span class="tag">${e}</span>`).join('')}</div>
        <div style="font-size:11px;color:var(--muted);">${totalSetCount}セット ／ vol: ${totalVolDay}kg</div>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════ CALENDAR ═══════════════
function renderCalendar() {
  const d=st.calMonth,y=d.getFullYear(),m=d.getMonth();
  document.getElementById('cal-month-title').textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const today=new Date().toISOString().split('T')[0];

  // 日付→部位リストのマップを事前構築
  const dateMusclemap = {};
  st.workouts.forEach(w=>{
    if(!dateMusclemap[w.date]) dateMusclemap[w.date]=new Set();
    dateMusclemap[w.date].add(w.muscle);
  });

  let h=['日','月','火','水','木','金','土'].map(n=>`<div class="cdn">${n}</div>`).join('');
  const pd=new Date(y,m,0).getDate();
  for(let i=first-1;i>=0;i--) h+=`<div class="cd om">${pd-i}</div>`;

  for(let day=1;day<=days;day++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const muscles=[...(dateMusclemap[ds]||[])];
    const hasW = muscles.length>0;
    const dots = hasW
      ? `<div class="cd-dots">${muscles.slice(0,4).map(mid=>`<span style="width:5px;height:5px;border-radius:50%;background:${getMuscleColor(mid)};display:inline-block;box-shadow:0 0 4px ${getMuscleColor(mid)}90;"></span>`).join('')}</div>`
      : '';
    const numColor = hasW ? getMuscleColor(muscles[0]) : (ds===today ? 'var(--text)' : '');
    h+=`<div class="cd ${ds===today?'today':''} ${hasW?'hw':''}" onclick="showCalDay('${ds}')"><span class="cd-num" style="${numColor?`color:${numColor};font-weight:600;`:''}">${day}</span>${dots}</div>`;
  }

  const rem=42-first-days;
  for(let i=1;i<=rem;i++) h+=`<div class="cd om">${i}</div>`;
  document.getElementById('cal-grid').innerHTML=h;
  document.getElementById('cal-detail').innerHTML='';
}

// ═══════════════ PROGRESS ═══════════════
function renderProgress(){
  const exSet=new Set();
  st.workouts.forEach(w=>w.exercises.forEach(e=>exSet.add(e)));
  const exList=[...exSet];
  if(!exList.length){document.getElementById('progress-filters').innerHTML='';document.getElementById('progress-empty').style.display='block';return;}
  document.getElementById('progress-empty').style.display='none';
  if(!st.progressFilter||!exList.includes(st.progressFilter)) st.progressFilter=exList[0];
  document.getElementById('progress-filters').innerHTML=exList.map(e=>
    `<button class="fbtn ${st.progressFilter===e?'on':''}" onclick="setProgressFilter('${e}')">${e}</button>`
  ).join('');
  drawCharts();
}
function setProgressFilter(ex){st.progressFilter=ex;renderProgress();}
function drawCharts(){
  const ex=st.progressFilter;
  const data=st.workouts.filter(w=>w.exercises.includes(ex)).sort((a,b)=>a.date.localeCompare(b.date));
  const labels=data.map(w=>{const d=new Date(w.date);return`${d.getMonth()+1}/${d.getDate()}`;});
  const maxW=data.map(w=>{const ss=w.sets.filter(s=>s.exercise===ex);return ss.length?Math.max(...ss.map(s=>s.weight)):0;});
  const vols=data.map(w=>w.sets.filter(s=>s.exercise===ex).reduce((a,s)=>a+s.weight*s.reps*s.sets,0));
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#ffffff08'},ticks:{color:'#5a5a72',font:{size:10}}},y:{grid:{color:'#ffffff08'},ticks:{color:'#5a5a72',font:{size:10}}}}};
  if(st.charts.p) st.charts.p.destroy();
  if(st.charts.v) st.charts.v.destroy();
  st.charts.p=new Chart(document.getElementById('progress-chart'),{type:'line',data:{labels,datasets:[{data:maxW,borderColor:'#c97b7b',backgroundColor:'#e8e8ec18',borderWidth:2,pointRadius:4,pointBackgroundColor:'#c97b7b',tension:.35,fill:true}]},options:opts});
  st.charts.v=new Chart(document.getElementById('volume-chart'),{type:'bar',data:{labels,datasets:[{data:vols,backgroundColor:'#60606860',borderColor:'#7aa8c8',borderWidth:1,borderRadius:4}]},options:opts});
}

const CLAUDE_MODEL = 'claude-sonnet-4-20250514';

function buildUserContext() {
  if(!st.profile) return '';
  const p=st.profile;
  const g=GOAL_INFO[p.goal]||{label:'不明'};
  const recentW=st.workouts.slice(-5).map(w=>`${w.muscleLabel}トレ(${w.exercises.join(',')})`).join(' / ');
  return `ユーザー情報:名前=${p.name}, 年齢=${p.age}歳, 性別=${p.gender==='male'?'男性':'女性'}, 身長=${p.height}cm, 体重=${p.weight}kg, 目標=${g.label}, 経験=${p.experience||'中級者'}, 直近トレーニング=${recentW||'なし'}`;

// 1日あたりのAI使用回数制限
const AI_DAILY_LIMIT = 20;
function getAiUsageToday() {
  const key = 'grind_ai_' + new Date().toISOString().split('T')[0];
  return parseInt(localStorage.getItem(key) || '0');
}
function incrementAiUsage() {
  const key = 'grind_ai_' + new Date().toISOString().split('T')[0];
  localStorage.setItem(key, String(getAiUsageToday() + 1));
}

async function callClaude(systemPrompt, userMsg) {
  if (getAiUsageToday() >= AI_DAILY_LIMIT) {
    throw new Error('本日のAI使用回数の上限（' + AI_DAILY_LIMIT + '回）に達しました。明日また試してください。');
  }
  incrementAiUsage();
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 800,
      system: systemPrompt,
      messages: [{role:'user', content: userMsg}]
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || 'エラーが発生しました';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if(!email || !pw) { errEl.textContent='メールとパスワードを入力してください'; errEl.style.display='block'; return; }
  const btn = document.querySelector('#auth-login .btn-acc');
  if(btn) { btn.disabled=true; btn.textContent='ログイン中...'; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error) {
    errEl.textContent = 'ログイン失敗: ' + error.message;
    errEl.style.display='block';
    if(btn) { btn.disabled=false; btn.textContent='ログイン'; }
    return;
  }
  // 手動で画面切り替え
  if(data.session) {
    await loadUserData(data.session.user.id);
    showAppScreen();
    initApp();
  }
}

function startSignup() {
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('setup-screen').style.display='block';
  renderSetup();
}

// ═══════════════ UTILS ═══════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// ═══════════════ BOOT ═══════════════
function showAuthScreen() {
  document.getElementById('auth-screen').style.display='block';
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('app').style.display='none';
}

function showAppScreen() {
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('app').style.display='flex';
}

(async function boot(){
  // Supabase SDKの読み込みを待つ
  let tries = 0;
  while (typeof supabase === 'undefined' && tries < 20) {
    await new Promise(r => setTimeout(r, 100));
    tries++;
  }

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      await loadUserData(session.user.id);
      showAppScreen();
      initApp();
    } else {
      showAuthScreen();
    }
  } catch(e) {
    console.error('boot error:', e);
    showAuthScreen();
  }
})();
</script>
